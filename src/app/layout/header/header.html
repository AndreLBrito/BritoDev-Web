<header class="site-header">
  <a class="skip-link" href="#main-content">Ir para o conteúdo</a>
  <div class="header-content container">
    <a class="brand" href="/" aria-label="BritoDev — página inicial" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span>Brito<span>Dev</span></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="main-navigation"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Fechar menu' : 'Abrir menu'"
      (click)="toggleMenu()"
    >
      @if (isMenuOpen()) {
        <svg lucideX aria-hidden="true"></svg>
      } @else {
        <svg lucideMenu aria-hidden="true"></svg>
      }
    </button>

    <nav id="main-navigation" aria-label="Navegação principal" [class.is-open]="isMenuOpen()">
      <ul>
        <li><a href="/#services" (click)="closeMenu()">Serviços</a></li>
        <li><a href="/#solutions" (click)="closeMenu()">Como trabalho</a></li>
        <li><a href="/#projects" (click)="closeMenu()">Projetos</a></li>
        <li><a href="/#about" (click)="closeMenu()">Sobre</a></li>
        <li>
          <a class="nav-cta" href="/#contact" (click)="closeMenu()"> Contato profissional </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
